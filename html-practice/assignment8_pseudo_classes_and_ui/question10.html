<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 8 - Question 10</title>
    <link rel="stylesheet" href="question10.css">
</head>
<body>
<header><h1>Shikha's Mini UI</h1><nav><a href="#home">Home</a><a href="#profile">Profile</a><a href="#contact">Contact</a></nav></header>
<main class="main-area" id="home">
  <section class="profile-card" id="profile">
    <div class="profile-top"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400" alt="Portrait of a smiling person"><div><h2>Welcome!</h2><p>Let's stay connected.</p></div></div>
    <form id="contact">
      <h3>Send a Message</h3>
      <label for="name">Name</label><input id="name" type="text" placeholder="Your name">
      <label for="email">Email</label><input id="email" type="email" placeholder="Your email">
      <label for="message">Message</label><textarea id="message" rows="3" placeholder="Write a message"></textarea>
      <div class="form-actions"><button type="submit">Submit</button><button type="reset" class="reset">Reset</button></div>
    </form>
  </section>
</main>
<footer>© 2026 Shikha Singh | Mini User Interface</footer>
</body>
</html>
