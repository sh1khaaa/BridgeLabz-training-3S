<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="question7.css">
</head>
<body>
<header><h1>Everyday UI Components</h1><p>A small collection of useful interface elements.</p></header>
<main class="ui-card">
  <section class="component">
    <h2>Search</h2>
    <form class="search-form"><input type="search" placeholder="Search topics..." aria-label="Search topics"><button type="submit">Search</button></form>
  </section>
  <section class="component">
    <h2>Quick Actions</h2>
    <div class="actions"><button type="button">Explore</button><button type="button" class="secondary">Save Item</button></div>
  </section>
  <section class="component">
    <h2>Choose a Category</h2>
    <label for="category">Category</label><select id="category"><option>Select a category</option><option>Frontend</option><option>Cybersecurity</option><option>Data Science</option></select>
  </section>
</main>
<footer>Simple components with consistent styling.</footer>
</body>
</html>
