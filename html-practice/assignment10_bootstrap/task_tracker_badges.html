    <!-- Bootstrap container, grid and utility classes are used throughout this page. -->
    <header class="bg-dark text-white py-4"><div class="container d-flex justify-content-between align-items-center flex-wrap gap-2"><div><h1 class="h2 mb-1">Task Tracker</h1><p class="mb-0 text-white-50">Keep your day moving forward</p></div><span class="badge text-bg-warning fs-6">3 Pending</span></div></header><main class="container py-5"><div class="row justify-content-center"><section class="col-lg-8"><div class="card shadow-sm"><div class="card-header bg-white d-flex justify-content-between align-items-center"><h2 class="h5 mb-0">My Tasks</h2><span class="badge text-bg-primary">Today</span></div><ul class="list-group list-group-flush"><li class="list-group-item d-flex justify-content-between align-items-center gap-3"><span>Complete Bootstrap assignment</span><span class="badge text-bg-danger">High</span></li><li class="list-group-item d-flex justify-content-between align-items-center gap-3"><span>Practice JavaScript basics</span><span class="badge text-bg-warning">Medium</span></li><li class="list-group-item d-flex justify-content-between align-items-center gap-3"><span>Organize project folders</span><span class="badge text-bg-success">Low</span></li></ul><div class="card-body text-end"><button type="button" class="btn btn-success">Completed <span class="badge text-bg-light text-success ms-1">1</span></button></div></div></section></div></main><footer class="text-center py-3 text-secondary">One task at a time. You've got this!</footer>
