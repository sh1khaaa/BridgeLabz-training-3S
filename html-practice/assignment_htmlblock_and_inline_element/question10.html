<!DOCTYPE html>
<html>
<head>
    <title>Tourist Place Selection</title>
</head>
<body>
    <h1>Select Your Travel Destination</h1>

    <!-- Dropdown Selection Form -->
    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option selected>India</option>
            <option>USA</option>
            <option>Canada</option>
        </select>
        <br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option selected>Uttar Pradesh</option>
            <option>Rajasthan</option>
            <option>Himachal Pradesh</option>
        </select>
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option selected>Mathura</option>
            <option>Agra</option>
            <option>Jaipur</option>
            <option>Manali</option>
        </select>
        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option selected>Taj Mahal</option>
            <option>Vrindavan</option>
            <option>Hawa Mahal</option>
            <option>Rohtang Pass</option>
        </select>
    </form>

    <!-- Selection Summary -->
    <h2>Your Selection Summary</h2>
    <p>Country: India</p>
    <p>State: Uttar Pradesh</p>
    <p>City: Mathura</p>
    <p>Favorite Tourist Place: Taj Mahal</p>
</body>
</html>
