<!DOCTYPE html>
<html>
<head>
    <title>Student Report Card</title>
</head>
<body>
    <!-- School Name -->
    <header>
        <h1>ABC Public School</h1>
        <h2>Student Report Card</h2>
    </header>

    <p>Student Name: Shikha Singh</p>
    <p>Class: B.Tech</p>

    <!-- Marks Table -->
    <table border="1" title="Student subject marks">
        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>
        <tr><th>Maximum Marks</th><th>Obtained Marks</th></tr>
        <tr><td>English</td><td>100</td><td>85</td></tr>
        <tr><td>Mathematics</td><td>100</td><td>90</td></tr>
        <tr><td>Computer Science</td><td>100</td><td>92</td></tr>
        <tr><td>Physics</td><td>100</td><td>80</td></tr>
        <tr><td>Chemistry</td><td>100</td><td>83</td></tr>
        <tr><th>Total</th><td>500</td><td>430</td></tr>
        <tr><th colspan="2">Percentage</th><td>86%</td></tr>
    </table>
</body>
</html>
