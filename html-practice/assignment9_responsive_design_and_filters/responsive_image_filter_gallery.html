<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>
<header><h1>Responsive Image Filter Gallery</h1><p>Explore six different CSS image filters.</p></header>
<main class="gallery">
<figure><img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Mountain landscape"><figcaption>Blur Filter</figcaption></figure>
<figure><img class="grayscale" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=700" alt="Ocean beach"><figcaption>Grayscale Filter</figcaption></figure>
<figure><img class="sepia" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700" alt="Lake and mountains"><figcaption>Sepia Filter</figcaption></figure>
<figure><img class="brightness" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700" alt="Green forest"><figcaption>Brightness Filter</figcaption></figure>
<figure><img class="contrast" src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=700" alt="Starry night sky"><figcaption>Contrast Filter</figcaption></figure>
<figure><img class="hue" src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?w=700" alt="Green indoor plant"><figcaption>Hue Rotate Filter</figcaption></figure>
</main><footer>Hover over an image to remove its filter.</footer>
</body>
</html>
